  /v1/audit-logs:
    get:
      tags: [Administración]
      summary: Listar auditoría
      operationId: listAuditLogs
      parameters:
        - $ref: '#/components/parameters/FromQuery'
        - $ref: '#/components/parameters/ToQuery'
        - name: action
          in: query
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Registros de auditoría
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    merchantHeader:
      type: apiKey
      in: header
      name: X-Merchant-Id
      description: UUID del comercio activo. El usuario debe tener membresía.

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    FromQuery:
      name: from
      in: query
      required: false
      schema:
        type: string
        format: date-time
    ToQuery:
      name: to
      in: query
      required: false
      schema:
        type: string
        format: date-time
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID generado por el cliente y reutilizado en reintentos.
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SaleId:
      name: saleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Petición mal formada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Token ausente o inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Sin permiso o sin membresía en el comercio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflicto de estado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Regla de negocio o validación semántica
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotImplemented:
      description: Función aún no disponible (SoftPOS real)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: El importe debe ser mayor que cero.
            details:
              type: array
              items:
                type: object
                additionalProperties: true
            requestId:
              type: string

    Money:
      type: string
      pattern: '^[0-9]+$'
      description: Importe en pesos enteros COP.
      example: '10000'

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 3

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: Segundos de vida del access token.
          example: 900

    User:
      type: object
      required: [id, email, fullName, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phone:
          type: string
          nullable: true
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        createdAt:
          type: string
          format: date-time

    Membership:
      type: object
      required: [merchantId, merchantName, status]
      properties:
        merchantId:
          type: string
          format: uuid
        merchantName:
          type: string
        status:
          type: string
          enum: [ACTIVE, INVITED, SUSPENDED]

    Merchant:
      type: object
      required: [id, name, currency, timezone, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        legalName:
          type: string
          nullable: true
        taxId:
          type: string
          nullable: true
        currency:
          type: string
          example: COP
        timezone:
          type: string
          example: America/Bogota
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, CLOSED]
        createdAt:
          type: string
          format: date-time

    Branch:
      type: object
      required: [id, code, name, isActive]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: MAIN
        name:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        isActive:
          type: boolean

    Category:
      type: object
      required: [id, name, sortOrder, isActive]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        color:
          type: string
          nullable: true
        sortOrder:
          type: integer
        isActive:
          type: boolean

    Product:
      type: object
      required: [id, type, name, price, currency, trackInventory, isActive]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [PRODUCT, SERVICE]
        name:
          type: string
        sku:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        taxRateId:
          type: string
          format: uuid
          nullable: true
        price:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          example: COP
        trackInventory:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaxRate:
      type: object
      required: [id, name, rateBp, isDefault, isActive]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: IVA 19%
        rateBp:
          type: integer
          minimum: 0
          maximum: 10000
          example: 1900
        isDefault:
          type: boolean
        isActive:
          type: boolean

    PaymentMethod:
      type: object
      required: [id, code, name, type, isSimulated, requiresProvider, isActive]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: CARD_SIMULATED
        name:
          type: string
        type:
          type: string
          enum: [CASH, TRANSFER, CARD_SOFTPOS, CARD_SIMULATED, OTHER]
        isSimulated:
          type: boolean
        requiresProvider:
          type: boolean
        isActive:
          type: boolean

    Customer:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        taxId:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    InventoryItem:
      type: object
      required: [productId, productName, quantity, updatedAt]
      properties:
        productId:
          type: string
          format: uuid
        productName:
          type: string
        sku:
          type: string
          nullable: true
        quantity:
          type: number
          format: double
          example: 12.5
        lowStockThreshold:
          type: number
          format: double
          nullable: true
        updatedAt:
          type: string
          format: date-time

    InventoryMovement:
      type: object
      required: [id, productId, type, quantityDelta, previousQuantity, newQuantity, createdAt]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        type:
          type: string
          enum: [INITIAL, PURCHASE, SALE, RETURN, ADJUSTMENT, LOSS]
        quantityDelta:
          type: number
          format: double
        previousQuantity:
          type: number
          format: double
        newQuantity:
          type: number
          format: double
        referenceType:
          type: string
          nullable: true
        referenceId:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        createdByUserId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    SaleStatus:
      type: string
      enum: [DRAFT, PENDING_PAYMENT, PAID, PARTIALLY_REFUNDED, REFUNDED, CANCELLED]

    PaymentStatus:
      type: string
      enum: [CREATED, PENDING, PROCESSING, APPROVED, REJECTED, CANCELLED, PARTIALLY_REFUNDED, REFUNDED]

    SaleItem:
      type: object
      required: [id, productId, productName, quantity, unitPrice, discount, taxRateBp, tax, lineTotal]
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        variantId:
